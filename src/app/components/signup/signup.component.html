<div class="form-container">
    <h2>Sign Up</h2>
    <form [formGroup]="signupForm" (ngSubmit)="onSubmit()">
      
      <!-- Name Input -->
      <div>
        <label for="name">Full Name</label>
        <input id="name" formControlName="name" type="text" />
        <div *ngIf="f['name'].touched && f['name'].invalid" class="error">
          <div *ngIf="f['name'].errors?.['required']">Name is required.</div>
          <div *ngIf="f['name'].errors?.['minlength']">Name must be at least 3 characters long.</div>
        </div>
      </div>
  
      <!-- Email Input -->
      <div>
        <label for="email">Email</label>
        <input id="email" formControlName="email" type="email" />
        <div *ngIf="f['email'].touched && f['email'].invalid" class="error">
          <div *ngIf="f['email'].errors?.['required']">Email is required.</div>
          <div *ngIf="f['email'].errors?.['email']">Invalid email format.</div>
        </div>
      </div>
  
      <!-- Password Input -->
      <div>
        <label for="password">Password</label>
        <input id="password" formControlName="password" type="password" />
        <div *ngIf="f['password'].touched && f['password'].invalid" class="error">
          <div *ngIf="f['password'].errors?.['required']">Password is required.</div>
          <div *ngIf="f['password'].errors?.['minlength']">Password must be at least 6 characters long.</div>
        </div>
      </div>
  
      <!-- Confirm Password Input -->
      <div>
        <label for="confirmPassword">Confirm Password</label>
        <input id="confirmPassword" formControlName="confirmPassword" type="password" />
        <div *ngIf="f['confirmPassword'].touched && f['confirmPassword'].invalid" class="error">
          <div *ngIf="f['confirmPassword'].errors?.['required']">Confirming your password is required.</div>
          <div *ngIf="signupForm.errors?.['passwordMismatch']">Passwords do not match.</div>
        </div>
      </div>
  
      <!-- Submit Button -->
      <button type="submit" [disabled]="signupForm.invalid">Sign Up</button>
    </form>
  </div>
